<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notes</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; background: #f4f4f5; color: #18181b; margin: 0; }
  header { display: flex; justify-content: space-between; align-items: center; padding: 12px 24px; background: #18181b; color: #fff; }
  header a { color: #fff; }
  main { max-width: 760px; margin: 24px auto; padding: 0 16px; display: grid; gap: 16px; }
  .card { background: #fff; padding: 16px; border-radius: 10px; box-shadow: 0 1px 3px #0002; }
  .note { display: flex; justify-content: space-between; align-items: start; gap: 12px; }
  .note h3 { margin: 0 0 4px; }
  .pin { font-size: 12px; background: #fef3c7; color: #92400e; padding: 2px 8px; border-radius: 99px; margin-left: 8px; }
  input, textarea, button { font: inherit; padding: 8px 10px; border-radius: 6px; border: 1px solid #d4d4d8; }
  button { cursor: pointer; background: #fff; }
  button.primary { background: #18181b; color: #fff; border: 0; }
  button.danger { color: #b91c1c; border-color: #fecaca; }
  form { display: grid; gap: 8px; }
  .toolbar { display: flex; gap: 8px; justify-content: flex-end; }
  #toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); padding: 12px 18px; border-radius: 8px; background: #18181b; color: #fff; }
  #toast.error { background: #b91c1c; }
  dialog { border: 0; border-radius: 10px; box-shadow: 0 10px 30px #0004; }
</style>
</head>
<body>
<header><strong>Notes</strong><span><span id="who"></span> · <a href="/logout">Sign out</a></span></header>
<main>
  <section class="card" id="new" hidden>
    <h2>New note</h2>
    <form id="form">
      <input name="title" placeholder="Title">
      <textarea name="body" placeholder="Write something" rows="3"></textarea>
      <label><input type="checkbox" name="pinned"> Pin to top</label>
      <button class="primary" type="submit">Save note</button>
    </form>
  </section>
  <div class="toolbar"><button id="export">Export CSV</button></div>
  <section id="list" aria-label="Notes"></section>
</main>
<div id="toast" role="status" hidden></div>
<dialog id="confirm" aria-labelledby="confirm-title">
  <p id="confirm-title">Delete this note? This cannot be undone.</p>
  <div class="toolbar"><button id="cancel">Cancel</button><button class="primary" id="yes">Yes, delete</button></div>
</dialog>
<script>
const $ = (s) => document.querySelector(s);
function toast(text, error) {
  const t = $('#toast'); t.textContent = text; t.className = error ? 'error' : ''; t.hidden = false;
  clearTimeout(toast.h); toast.h = setTimeout(() => (t.hidden = true), 4000);
}
async function load() {
  const notes = await (await fetch('/api/notes')).json();
  notes.sort((a, b) => b.pinned - a.pinned);
  $('#list').innerHTML = '';
  for (const n of notes) {
    const el = document.createElement('article');
    el.className = 'card note';
    el.innerHTML = `<div><h3></h3><p></p></div><button class="danger" aria-label="Delete note">Delete</button>`;
    el.querySelector('h3').textContent = n.title;
    if (n.pinned) el.querySelector('h3').insertAdjacentHTML('beforeend', '<span class="pin">Pinned</span>');
    el.querySelector('p').textContent = n.body;
    el.querySelector('button').onclick = () => ask(n);
    $('#list').append(el);
  }
}
function ask(n) {
  const d = $('#confirm');
  $('#yes').onclick = async () => {
    d.close();
    const r = await fetch('/api/notes/' + n.id, { method: 'DELETE' });
    if (r.ok) { toast('Note deleted.'); load(); }
    else toast('Something went wrong. Please try again.', true);
  };
  $('#cancel').onclick = () => d.close();
  d.showModal();
}
$('#form').onsubmit = async (e) => {
  e.preventDefault();
  const f = new FormData(e.target);
  const r = await fetch('/api/notes', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ title: f.get('title'), body: f.get('body'), pinned: f.get('pinned') === 'on' }) });
  if (r.ok) { toast('Note saved.'); e.target.reset(); load(); }
  else toast((await r.json()).error ?? 'Could not save.', true);
};
$('#export').onclick = async () => {
  const r = await fetch('/api/export');
  toast(r.ok ? 'Export ready.' : 'Export failed.', !r.ok);
};
fetch('/api/me').then((r) => r.json()).then((me) => {
  $('#who').textContent = `${me.user} (${me.role})`;
  $('#new').hidden = me.role !== 'admin';
});
load();
</script>
</body>
</html>
